name: SoundLab
options:
  bundleIdPrefix: com.leeo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SoundLab:
    type: application
    platform: iOS
    sources:
      - SoundLab
    info:
      path: SoundLab/Info.plist
      properties:
        CFBundleDisplayName: SoundLab
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: 필드 레코딩 과제를 위해 마이크를 사용합니다.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.SoundLab
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QGAQ3AY3R3
        GENERATE_INFOPLIST_FILE: NO
